<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Um Convite Especial ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;700&display=swap');

        body {
            background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        /* Container do Convite */
        .painel {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 20;
            max-width: 80%;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #db2777;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        #btnSim {
            background: #ff1493;
            color: white;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
        }

        #btnSim:hover {
            transform: scale(1.1);
            background: #ff69b4;
        }

        #btnNao {
            background: #999;
            color: white;
            position: relative;
        }

        /* Rosas Gigantes */
        .rosa {
            position: absolute;
            font-size: 100px;
            z-index: 5;
            animation: pularERodar 4s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pularERodar {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-100px) rotate(20deg) scale(1.2); }
        }

        .marca-dagua {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="painel">
        <h1>Mari, aceita sair comigo? 🌹</h1>
        <div class="botoes">
            <button id="btnSim" onclick="aceitou()">SIM!</button>
            <button id="btnNao" onmouseover="fugir()" onclick="fugir()">NÃO</button>
        </div>
    </div>

    <div class="marca-dagua">Criado por Giovana Top Programation ✨</div>

    <script>
        // Criar Rosas Gigantes
        const emojis = ['🌹', '🌷', '🌸'];
        for (let i = 0; i < 12; i++) {
            const rosa = document.createElement('div');
            rosa.className = 'rosa';
            rosa.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            rosa.style.left = Math.random() * 90 + 'vw';
            rosa.style.top = Math.random() * 80 + 'vh';
            rosa.style.animationDelay = (Math.random() * 2) + 's';
            document.body.appendChild(rosa);
        }

        // Função para o botão NÃO fugir
        function fugir() {
            const btnNao = document.getElementById('btnNao');
            const x = Math.random() * (window.innerWidth - btnNao.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNao.offsetHeight);
            
            btnNao.style.position = "absolute";
            btnNao.style.left = x + "px";
            btnNao.style.top = y + "px";
        }

        // Função quando clicar em SIM
        function aceitou() {
            alert("tira ropa❤️✨");
            // Se quiser que vá para o WhatsApp após o OK, desmarque a linha abaixo:
            // window.location.href = "https://wa.me/SEUNUMERO";
        }
    </script>
</body>
</html>
